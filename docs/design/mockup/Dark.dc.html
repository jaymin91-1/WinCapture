<!doctype html>

</head>
<body>
<x-dc>
<helmet>

</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; background: #17171C; color: #F9FAFB; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; border: 1px solid #2C2C35; border-radius: 8px; overflow: hidden">

  <div style="height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 16px; background: #101013; border-bottom: 1px solid #2C2C35">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="4" fill="#F9FAFB"></rect><circle cx="8" cy="8" r="2.5" fill="{{accent}}"></circle></svg>
      <span style="font-size: 12px; color: #A0A7B1">WinCapture 설정</span>
    </div>
    <div style="display: flex; height: 40px">
      <button aria-label="최소화" style="width: 46px; height: 40px; border: 0; background: transparent; color: #A0A7B1; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"></path></svg></button>
      <button aria-label="최대화" style="width: 46px; height: 40px; border: 0; background: transparent; color: #A0A7B1; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"></rect></svg></button>
      <button aria-label="닫기" style="width: 46px; height: 40px; border: 0; background: transparent; color: #A0A7B1; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></button>
    </div>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">

    <nav aria-label="설정 탭" style="width: 220px; flex: none; box-sizing: border-box; padding: 20px 12px; background: #101013; border-right: 1px solid #2C2C35; display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; padding: 4px 12px 18px; letter-spacing: -0.3px">WinCapture</div>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #D1D6DB; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>일반
      </button>
      <button aria-current="page" style="height: 40px; border: 0; border-radius: 8px; background: #1E2A40; color: #F9FAFB; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; font-weight: 600; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2.5"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>단축키
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #D1D6DB; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path></svg>캡처
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #D1D6DB; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2.5"></rect><path d="M16 10l6-3v10l-6-3"></path></svg>녹화
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #D1D6DB; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg>FFmpeg
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #D1D6DB; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5h.01"></path></svg>정보
      </button>
      <div style="flex: 1"></div>
      <div style="padding: 0 12px; font-size: 12px; color: #A0A7B1">버전 0.1.0</div>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; overflow: hidden; display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.4px">단축키</h1>
          <p style="margin: 0; color: #A0A7B1">항목을 누르고 새 조합키를 입력하세요. 저장하면 바로 적용됩니다.</p>
        </div>
        <button style="height: 36px; padding: 0 14px; border: 1px solid #3C3C47; border-radius: 8px; background: transparent; color: #F9FAFB; font-size: 13px; flex: none">기본값으로</button>
      </div>

      <div style="background: #202027; border: 1px solid #2C2C35; border-radius: 12px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px; border-bottom: 1px solid #2C2C35">
          <span style="flex: 1">영역 지정</span>
          <button aria-label="영역 지정 단축키 변경" style="display: flex; gap: 4px; align-items: center; border: 0; background: transparent; padding: 4px; border-radius: 6px"><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Alt</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">R</kbd></button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px; border-bottom: 1px solid #2C2C35">
          <span style="flex: 1">스크린샷</span>
          <button aria-label="스크린샷 단축키 변경" style="display: flex; gap: 4px; align-items: center; border: 0; background: transparent; padding: 4px; border-radius: 6px"><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Alt</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">S</kbd></button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px; border-bottom: 1px solid #2C2C35; background: #1A2333">
          <span style="flex: 1">동영상 녹화 시작 · 정지</span>
          <span style="font-size: 12px; color: {{accent}}">새 조합키를 누르세요…</span>
          <button aria-label="동영상 녹화 단축키 입력 중" style="display: flex; gap: 4px; align-items: center; border: 1px solid {{accent}}; background: #17171C; padding: 4px 8px; border-radius: 6px; height: 34px; box-sizing: border-box; min-width: 120px; justify-content: center"><kbd style="min-width: 28px; height: 22px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #202027; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 22px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #202027; color: #F9FAFB; font-family: inherit; font-size: 12px">Shift</kbd></button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px; border-bottom: 1px solid #2C2C35">
          <span style="flex: 1">GIF 녹화 시작 · 정지</span>
          <button aria-label="GIF 녹화 단축키 변경" style="display: flex; gap: 4px; align-items: center; border: 0; background: transparent; padding: 4px; border-radius: 6px"><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Alt</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">G</kbd></button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px; border-bottom: 1px solid #2C2C35">
          <span style="flex: 1">테두리 표시 · 숨김</span>
          <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #FF7A85"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v4M12 17.5h.01"></path></svg>다른 앱이 사용 중</span>
          <button aria-label="테두리 표시 단축키 변경" style="display: flex; gap: 4px; align-items: center; border: 0; background: transparent; padding: 4px; border-radius: 6px"><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #8A3A44; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #8A3A44; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Alt</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #8A3A44; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">H</kbd></button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px; border-bottom: 1px solid #2C2C35">
          <span style="flex: 1">영역 해제</span>
          <button aria-label="영역 해제 단축키 변경" style="display: flex; gap: 4px; align-items: center; border: 0; background: transparent; padding: 4px; border-radius: 6px"><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Alt</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">X</kbd></button>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 0 18px; height: 50px">
          <span style="flex: 1">앱 창 표시 · 숨김</span>
          <button aria-label="앱 창 표시 단축키 변경" style="display: flex; gap: 4px; align-items: center; border: 0; background: transparent; padding: 4px; border-radius: 6px"><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Ctrl</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">Alt</kbd><kbd style="min-width: 28px; height: 26px; box-sizing: border-box; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #3C3C47; border-bottom-width: 2px; border-radius: 6px; background: #17171C; color: #F9FAFB; font-family: inherit; font-size: 12px">W</kbd></button>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#4D8EF7","options":["#4D8EF7","#2FCB8E","#9B87FF","#F9FAFB"]},"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#4D8EF7' };
}
}
</script>
</body>
</html>
