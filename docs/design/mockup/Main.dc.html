<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>WinCapture 설정 · 라이트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2F7CF6}a:hover{color:#1B64DA}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 960px; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; background: #F2F4F6; color: #191F28; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; border: 1px solid #E5E8EB; border-radius: 8px; overflow: hidden">

  <div style="height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 16px; background: #FFFFFF; border-bottom: 1px solid #E5E8EB">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="14" height="14" rx="4" fill="#191F28"></rect><circle cx="8" cy="8" r="2.5" fill="{{accent}}"></circle></svg>
      <span style="font-size: 12px; color: #6B7684">WinCapture 설정</span>
    </div>
    <div style="display: flex; height: 40px">
      <button aria-label="최소화" style="width: 46px; height: 40px; border: 0; background: transparent; color: #6B7684; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor"></path></svg></button>
      <button aria-label="최대화" style="width: 46px; height: 40px; border: 0; background: transparent; color: #6B7684; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"></rect></svg></button>
      <button aria-label="닫기" style="width: 46px; height: 40px; border: 0; background: transparent; color: #6B7684; display: flex; align-items: center; justify-content: center"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></button>
    </div>
  </div>

  <div style="flex: 1; display: flex; min-height: 0">

    <nav aria-label="설정 탭" style="width: 220px; flex: none; box-sizing: border-box; padding: 20px 12px; background: #FFFFFF; border-right: 1px solid #E5E8EB; display: flex; flex-direction: column; gap: 2px">
      <div style="font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; padding: 4px 12px 18px; letter-spacing: -0.3px">WinCapture</div>
      <button aria-current="page" style="height: 40px; border: 0; border-radius: 8px; background: #E8F3FF; color: #1B64DA; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; font-weight: 600; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>일반
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #333D4B; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2.5"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>단축키
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #333D4B; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"></path></svg>캡처
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #333D4B; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2.5"></rect><path d="M16 10l6-3v10l-6-3"></path></svg>녹화
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #333D4B; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"></path></svg>FFmpeg
      </button>
      <button style="height: 40px; border: 0; border-radius: 8px; background: transparent; color: #333D4B; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 14px; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5h.01"></path></svg>정보
      </button>
      <div style="flex: 1"></div>
      <div style="padding: 0 12px; font-size: 12px; color: #6B7684">버전 0.1.0</div>
    </nav>

    <main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; overflow: hidden; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 26px; letter-spacing: -0.4px">일반</h1>
        <p style="margin: 0; color: #6B7684">저장 위치와 앱 동작을 정합니다.</p>
      </div>

      <section aria-label="저장" style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #6B7684; letter-spacing: 0.4px">저장</h2>
        <div style="background: #FFFFFF; border: 1px solid #E5E8EB; border-radius: 12px; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #F2F4F6">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <label for="folder" style="font-weight: 600">저장 폴더</label>
              <span style="font-size: 12px; color: #6B7684">스크린샷, 동영상, GIF가 여기에 저장됩니다.</span>
            </div>
            <input id="folder" value="%USERPROFILE%\Pictures\WinCapture" style="width: 260px; height: 36px; box-sizing: border-box; border: 1px solid #D1D6DB; border-radius: 8px; padding: 0 12px; background: #F2F4F6; color: #191F28; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px">
            <button style="height: 36px; padding: 0 14px; border: 1px solid #D1D6DB; border-radius: 8px; background: #FFFFFF; color: #191F28; font-size: 13px">찾아보기</button>
          </div>
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #F2F4F6">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <label for="pattern" style="font-weight: 600">파일 이름</label>
              <span style="font-size: 12px; color: #6B7684">예: WinCapture_20261127_103015.png</span>
            </div>
            <input id="pattern" value="WinCapture_{date}_{time}" style="width: 260px; height: 36px; box-sizing: border-box; border: 1px solid #D1D6DB; border-radius: 8px; padding: 0 12px; background: #F2F4F6; color: #191F28; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px">
          </div>
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600">형식별 하위 폴더</span>
              <span style="font-size: 12px; color: #6B7684">Screenshots, Videos, GIFs 폴더로 나눠 저장</span>
            </div>
            <button role="switch" aria-checked="false" aria-label="형식별 하위 폴더" style="width: 40px; height: 22px; border-radius: 11px; border: 1px solid #B0B8C1; background: #FFFFFF; padding: 0 3px; display: flex; align-items: center; justify-content: flex-start"><span style="width: 14px; height: 14px; border-radius: 7px; background: #8B95A1"></span></button>
          </div>
        </div>
      </section>

      <section aria-label="동작" style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; font-weight: 600; color: #6B7684; letter-spacing: 0.4px">동작</h2>
        <div style="background: #FFFFFF; border: 1px solid #E5E8EB; border-radius: 12px; display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #F2F4F6">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600">캡처할 때 앱 창 자동 숨기기</span>
              <span style="font-size: 12px; color: #6B7684">설정 창이 캡처 영역과 겹치면 잠시 숨깁니다.</span>
            </div>
            <button role="switch" aria-checked="true" aria-label="캡처할 때 앱 창 자동 숨기기" style="width: 40px; height: 22px; border-radius: 11px; border: 0; background: {{accent}}; padding: 0 4px; display: flex; align-items: center; justify-content: flex-end"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FFFFFF"></span></button>
          </div>
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-bottom: 1px solid #F2F4F6">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600">마지막 캡처 영역 기억</span>
              <span style="font-size: 12px; color: #6B7684">다음 실행 때 같은 영역으로 시작합니다.</span>
            </div>
            <button role="switch" aria-checked="true" aria-label="마지막 캡처 영역 기억" style="width: 40px; height: 22px; border-radius: 11px; border: 0; background: {{accent}}; padding: 0 4px; display: flex; align-items: center; justify-content: flex-end"><span style="width: 14px; height: 14px; border-radius: 7px; background: #FFFFFF"></span></button>
          </div>
          <div style="display: flex; align-items: center; gap: 16px; padding: 14px 18px">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 600">Windows 시작 시 실행</span>
            </div>
            <button role="switch" aria-checked="false" aria-label="Windows 시작 시 실행" style="width: 40px; height: 22px; border-radius: 11px; border: 1px solid #B0B8C1; background: #FFFFFF; padding: 0 3px; display: flex; align-items: center; justify-content: flex-start"><span style="width: 14px; height: 14px; border-radius: 7px; background: #8B95A1"></span></button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F7CF6","options":["#2F7CF6","#00A86B","#7B61FF","#191F28"]},"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F7CF6' };
}
}
</script>
</body>
</html>
